<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form method="post">
        <h2>Donor information</h2>
        <fieldset>
            <table>
                <tr>
                    <td><label for="fname">First Name*</label></td>
                    <td><input type="text" id="fname" name="fname" required></td>
                </tr>
                <tr>
                    <td><label for="Lname">Last Name*</label></td>
                    <td><input type="text" id="Lname" name="Lname" required></td>
                </tr>
                <tr>
                    <td><label for="company">Company:</label></td>
                    <td><input type="text" id="company" name="company" required></td>
                </tr>
                <tr>
                    <td><label for="address1">Address 1*</label></td>
                    <td><input type="text" id="address1" name="address1" required></td>
                </tr>
                <tr>
                    <td><label for="address2">Address 2</label></td>
                    <td><input type="text" id="address2" name="address2" required></td>
                </tr>
                <tr>
                    <td><label for="city">City*</label></td>
                    <td><input type="text" id="city" name="city" required></td>
                </tr>
                <tr>
                    <td><label for="state">State*</label></td>
                    <td>
                        <select id="state" name="state">
                            <option> Please select any </option>
                            <option> Bhola</option>
                            <option> Comilla</option>
                            <option> Barishal</option>
                            <option> Dhaka</option>
                            <option> Khulna</option>
                    </td>
                    </select>
                </tr>
                <tr>
                    <td><label for="zip">Zip Code*</label></td>
                    <td><input type="number" id="zip" name="zip" required></td>
                </tr>
                <tr>
                    <td><label for="country">Country*</label></td>
                    <td>
                        <select id="country" name="country">
                            <option> Please select any </option>
                            <option> Bangladesh</option>
                            <option> India</option>
                            <option> Uk</option>
                            <option> USA</option>
                            <option> Italy</option>
                    </td>
                <tr>
                    <td><label for="phone">Phone</label></td>
                    <td><input type="number" id="phone" name="phone" required></td>
                </tr>
                <tr>
                    <td><label for="fax">Fax</label></td>
                    <td><input type="text" id="fax" name="fax" required></td>
                </tr>
                <tr>
                    <td><label for="email">Email*</label></td>
                    <td><input type="email" id="email" name="email" required></td>
                </tr>
                <tr>
                    <td><label>Donation Amount*</label>
                        <p>(check a button or type in your amount)</p>
                    </td>

                    <td>
                        <input type="radio" name="donation amount" value="none">None
                        <input type="radio" name="donation amount" value="50">$50
                        <input type="radio" name="donation amount" value="75">$75
                        <input type="radio" name="donation amount" value="75">$75
                        <input type="radio" name="donation amount" value="100">$100
                        <input type="radio" name="donation amount" value="250">$250
                        <input type="radio" name="donation amount" value="others">Others
                    </td>

                <tr>
                    <td></td>
                    <td><label for="others ammount">Others Amount$</label>
                        <input type="text" id="others amount" name="others amount" required>
                    </td>
                </tr>
                <tr>
                    <td><label>Recurring Donation:</label>
                        <p>(check if yes)</p>
                    </td>

                    <td>
                        <input type="checkbox" name="recurring" value="yes">I am interested in giving on a regular
                        basis.
                    </td>
                <tr>
                    <td></td>
                    <td><label for="monthly">Monthly Credit Card $</label>
                        <input type="number" id="monthly" name="monthly" size="6">
                        <label for="months">For</label>
                        <input type="number" id="months" name="months" size="4">
                        Months
                    </td>
                </tr>


                </select>
                </tr>

            </table>

        </fieldset>

    </form>

</body>

</html>
